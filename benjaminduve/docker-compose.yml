services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benjaminduve_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "chgrp -R www-data storage bootstrap/cache &&
      chmod -R g+rwX storage bootstrap/cache &&
      if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi &&
      if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi &&
      if [ ! -L public/storage ]; then php artisan storage:link; fi &&
      apache2-foreground"

  db:
    image: mysql:8.0
    container_name: benjaminduve_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: benjaminduve
      MYSQL_USER: benjaminduve
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: benjaminduve_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8081:80"

  frontend:
    image: node:24-alpine
    container_name: benjaminduve_frontend
    restart: unless-stopped
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    environment:
      VITE_API_BASE_URL: /api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  db_data:
  frontend_node_modules:
