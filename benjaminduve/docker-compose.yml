services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benjaminduve_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "chgrp -R www-data storage bootstrap/cache &&
      chmod -R g+rwX storage bootstrap/cache &&
      if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi &&
      php artisan key:generate --force &&
      php artisan storage:link || true &&
      apache2-foreground"

  db:
    image: mysql:8.0
    container_name: benjaminduve_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: benjaminduve
      MYSQL_USER: benjaminduve
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: benjaminduve_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8081:80"

volumes:
  db_data:
